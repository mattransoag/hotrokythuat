<!doctype html><html lang="vi"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;font:15px system-ui,Arial;color:#334155}.wrap{max-width:820px;margin:auto;background:white;padding:24px;border-radius:14px;border:1px solid #e2e8f0}h2{margin:0 0 22px;padding:15px;background:linear-gradient(100deg,#b71e16,#f34a05);border-bottom:4px solid #ffbd0a;color:white;text-align:center;border-radius:10px;font-size:19px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:7px}.full{grid-column:1/-1}label{font-weight:700}input,select,textarea{padding:12px;border:1px solid #cbd5e1;border-radius:7px;font:inherit;width:100%}textarea{min-height:120px}button{background:#ffbd0a;color:#9c1c15;border:0;border-radius:7px;padding:14px;font:inherit;font-weight:800;cursor:pointer;width:100%;margin-top:18px}button:disabled{opacity:.6;cursor:wait}.msg{white-space:pre-wrap;line-height:1.65;padding:15px;border-radius:8px;background:#e9f5ec;margin-top:16px}.err{background:#fff0ed;color:#a21b17}.tabs{display:flex;gap:10px;margin-bottom:18px}.tabs button{margin:0;background:#edf2f7;color:#475569}.tabs button.active{background:#b91f17;color:white}.hidden{display:none}.small{font-size:13px;color:#64748b;line-height:1.6}@media(max-width:620px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:12px}h2{font-size:16px}}</style></head><body><div class="wrap"><div class="tabs"><button class="active" onclick="switchTab('send',this)">GỬI YÊU CẦU</button><button onclick="switchTab('lookup',this)">TRA CỨU</button></div><section id="send"><h2>ⓘ THÔNG TIN CÁ NHÂN / ĐƠN VỊ GỬI</h2><form id="f"><div class="grid"><div class="field"><label>Họ và tên *</label><input name="name" required maxlength="100"></div><div class="field"><label>Đơn vị *</label><input name="unit" required maxlength="150"></div><div class="field"><label>Số điện thoại</label><input name="phone" maxlength="20"></div><div class="field"><label>Email nhận phản hồi *</label><input name="email" type="email" required maxlength="160"></div><div class="field full"><label>Nền tảng gặp sự cố *</label><select name="category" required><option value="">Chọn hệ thống nền tảng...</option><option>Phần mềm tác nghiệp</option><option>Chữ ký số</option><option>Chuyển đổi số</option><option>Khác</option></select></div><div class="field full"><label>Tiêu đề lỗi / Yêu cầu *</label><input name="subject" required maxlength="180"></div><div class="field full"><label>Mô tả chi tiết *</label><textarea name="detail" required maxlength="5000"></textarea></div></div><p class="small">Không nhập mật khẩu, mã OTP hoặc thông tin bí mật. Mã phiếu và mã xác thực được gửi qua Gmail.</p><button id="sendBtn">➤ GỬI YÊU CẦU</button></form><div id="sendMsg" role="status"></div></section><section id="lookup" class="hidden"><h2>TRA CỨU YÊU CẦU CỦA TÔI</h2><form id="lf"><div class="grid"><div class="field"><label>Mã phiếu *</label><input name="id" required></div><div class="field"><label>Mã xác thực *</label><input name="code" required></div></div><button id="lookupBtn">TRA CỨU</button></form><div id="lookupMsg" role="status"></div></section></div><script>
function switchTab(id,btn){document.querySelectorAll('section').forEach(x=>x.classList.toggle('hidden',x.id!==id));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function msg(id,t,error){const x=document.getElementById(id);x.className='msg'+(error?' err':'');x.textContent=t}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();const b=document.getElementById('sendBtn');b.disabled=true;const p=Object.fromEntries(new FormData(this).entries());msg('sendMsg','Đang tiếp nhận...');google.script.run.withSuccessHandler(r=>{b.disabled=false;msg('sendMsg','Đã tiếp nhận yêu cầu!\nMã phiếu: '+r.id+'\nMã xác thực: '+r.verificationCode+'\n'+(r.emailSent?'Đã gửi thông báo đến Gmail.':'Gửi Gmail chưa thành công. Vui lòng lưu hai mã trên để tra cứu.'));document.getElementById('f').reset()}).withFailureHandler(e=>{b.disabled=false;msg('sendMsg',e.message||'Có lỗi xảy ra',true)}).submitTicket(p)});
document.getElementById('lf').addEventListener('submit',function(e){e.preventDefault();const b=document.getElementById('lookupBtn');b.disabled=true;const p=Object.fromEntries(new FormData(this).entries());msg('lookupMsg','Đang tra cứu...');google.script.run.withSuccessHandler(r=>{b.disabled=false;msg('lookupMsg','Mã phiếu: '+r.id+'\nĐơn vị: '+r.unit+'\nTiêu đề: '+r.subject+'\nNội dung: '+r.detail+'\nTrạng thái: '+r.status+'\nKết quả xử lý: '+(r.result||'Chưa cập nhật'))}).withFailureHandler(e=>{b.disabled=false;msg('lookupMsg',e.message||'Tra cứu thất bại',true)}).lookupTicket(p.id,p.code)});
</script></body></html>
